services:
  friet:
    image: ghcr.io/mbols2510/friet-traktatie:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADMIN_USER: admin
      # Verplicht: ADMIN_PASSWORD=iets docker compose up -d
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Zet ADMIN_PASSWORD}
    volumes:
      - friet-data:/data

volumes:
  friet-data:
